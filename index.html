<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NOpex 3D // OPEN-AIR HIP-HOP FESTIVAL & LIVE STAGE</title>
  <meta name="description" content="Open-Air 3D Hip-Hop Festival & Live Stage featuring synchronized YouTube concert broadcast, brutalist stage lighting, and anonymous P2P multiplayer crowd." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050508;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff0055;
      --neon-lime: #22e033;
      --neon-amber: #ffaa00;
      --text-dim: #7a7d8a;
      --panel-bg: rgba(9, 10, 15, 0.85);
      --panel-border: rgba(255, 255, 255, 0.12);
      --font-display: 'Chakra Petch', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-display);
      color: #fff;
    }

    /* Main Viewport containing dual renderers */
    #viewport-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* WebGL Canvas */
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* CSS3D Renderer Viewport - matches WebGL coordinates exactly */
    #css3d-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    /* Strictly lock stage screen from user clicking - 24/7 continuous stream */
    .css3d-interactive {
      pointer-events: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    /* Post-Processing CRT / Visor Shader Overlay */
    #visor-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      background: linear-gradient(rgba(18, 16, 26, 0) 50%, rgba(0, 0, 0, 0.10) 50%),
                  linear-gradient(90deg, rgba(0,240,255,0.012), rgba(0,0,0,0), rgba(255,0,85,0.012));
      background-size: 100% 4px, 8px 100%;
    }

    #visor-overlay.active {
      opacity: 0.7;
      box-shadow: inset 0 0 60px rgba(0, 240, 255, 0.15);
    }

    #visor-overlay.active::after {
      content: "VISOR_HUD // OPTICAL_LINK_ACTIVE";
      position: absolute;
      top: 24px;
      right: 28px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ---------------- HUD & INTERFACE ---------------- */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
    }

    /* Top Bar */
    .hud-topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: auto;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-tag {
      font-size: 11px;
      font-family: var(--font-mono);
      letter-spacing: 3px;
      color: var(--neon-pink);
      text-transform: uppercase;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-name span {
      color: var(--neon-cyan);
    }

    .status-badges {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .hud-badge {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 6px 12px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neon-lime);
      box-shadow: 0 0 8px var(--neon-lime);
      animation: pulse-beat 0.44s infinite;
    }

    @keyframes pulse-beat {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    /* Concert & Audio Controls (Top Right) */
    .concert-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .hud-btn {
      background: rgba(15, 18, 25, 0.85);
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 7px 14px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .hud-btn:hover {
      border-color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
    }

    .hud-btn.active {
      border-color: var(--neon-pink);
      color: var(--neon-pink);
    }

    /* Bottom Section */
    .hud-bottombar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: auto;
    }

    /* Emotes & Quick Actions */
    .hud-emotes {
      display: flex;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 8px;
      border-radius: 6px;
      backdrop-filter: blur(10px);
    }

    .emote-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 78px;
      transition: all 0.2s;
    }

    .emote-btn kbd {
      font-size: 10px;
      color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.15);
      padding: 1px 4px;
      border-radius: 2px;
    }

    .emote-btn:hover, .emote-btn.active {
      background: rgba(255, 0, 85, 0.2);
      border-color: var(--neon-pink);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    /* Customization Modal Drawer */
    #customizer-panel {
      position: absolute;
      bottom: 84px;
      left: 20px;
      width: 320px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8);
      pointer-events: auto;
      z-index: 20;
    }

    #customizer-panel.visible {
      display: flex;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--neon-cyan);
    }

    .panel-section-title {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .color-chip {
      height: 32px;
      border-radius: 4px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-chip:hover {
      transform: scale(1.08);
      border-color: #fff;
    }

    .color-chip.selected {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .accessories-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .accessory-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }

    .accessory-item input {
      accent-color: var(--neon-cyan);
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    /* Track/Setlist Selector Modal */
    #setlist-panel {
      position: absolute;
      top: 64px;
      right: 20px;
      width: 340px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8);
      pointer-events: auto;
      z-index: 20;
    }

    #setlist-panel.visible {
      display: flex;
    }

    .setlist-item {
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .setlist-item:hover, .setlist-item.active {
      border-color: var(--neon-pink);
      background: rgba(255, 0, 85, 0.12);
    }

    .setlist-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .setlist-artist {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
    }

    .custom-url-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .custom-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 6px 10px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .custom-input:focus {
      outline: none;
      border-color: var(--neon-cyan);
    }

    /* Reticle / Pointer Lock Hint */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
      display: none;
      z-index: 8;
    }

    #crosshair.locked {
      display: block;
      box-shadow: 0 0 6px var(--neon-cyan);
    }

    /* Instructions Toast */
    #toast-msg {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(5, 7, 12, 0.88);
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.25);
      border-radius: 30px;
      padding: 8px 20px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #fff;
      pointer-events: none;
      opacity: 0.9;
      transition: opacity 0.5s;
      z-index: 12;
      text-align: center;
      white-space: nowrap;
    }
  </style>

  <!-- YouTube IFrame Player API for direct synchronized audio/video stream control -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <!-- Fullscreen Dual-Renderer Container -->
  <div id="viewport-container">
    <!-- WebGL Canvas for dark festival environment & dynamic lights -->
    <canvas id="webgl-canvas"></canvas>

    <!-- CSS3D Overlay for Stage Screen YouTube Embed -->
    <div id="css3d-container"></div>

    <!-- Visor CRT / Optical Shader Overlay -->
    <div id="visor-overlay"></div>

    <!-- Center Reticle for Pointer Lock -->
    <div id="crosshair"></div>
  </div>

  <!-- Heads Up Display -->
  <div id="hud-overlay">
    <!-- Top Bar -->
    <header class="hud-topbar">
      <div class="brand-title">
        <span class="brand-tag">Brutalist Stage // P2P Net</span>
        <h1 class="brand-name">OCTANE <span>3D</span> // FESTIVAL</h1>
      </div>

      <div class="status-badges">
        <div class="hud-badge" title="P2P Crowd Attendance">
          <div class="pulse-dot"></div>
          <span id="crowd-count">CROWD: 1 / 100</span>
        </div>

        <div class="hud-badge" title="Stage Lighting Tempo">
          <span id="bpm-display">135 BPM</span>
        </div>

        <div class="concert-controls">
          <!-- 24/7 Live Broadcast Status Indicator -->
          <div class="hud-badge" style="border-color: rgba(255, 0, 85, 0.5); background: rgba(255, 0, 85, 0.15); display: flex; gap: 8px; align-items: center;" title="24/7 Continuous Live Concert Stream">
            <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--neon-pink); box-shadow: 0 0 8px var(--neon-pink); animation: pulse-beat 0.9s infinite;"></span>
            <span style="color: var(--neon-pink); font-weight: 800; letter-spacing: 0.5px;">24/7 ON AIR:</span>
            <span id="live-broadcast-label" style="font-weight: 700; color: #fff; letter-spacing: 0.5px;">FUTURE // ROLLING LOUD</span>

          <!-- Audio Status & Unmute Trigger -->
          <button id="btn-sound-toggle" class="hud-btn" style="border-color: var(--neon-lime); color: var(--neon-lime);" title="Click to Unmute / Mute Concert Audio">
            <span id="sound-icon">🔊</span> <span id="sound-text">SOUND ON</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Avatar Customization Drawer -->
    <div id="customizer-panel">
      <div class="panel-header">
        <span>AVATAR RIG CONFIG</span>
        <button id="close-customizer" class="hud-btn" style="padding: 2px 8px;">✕</button>
      </div>

      <div class="panel-section-title">Color Palette</div>
      <div class="palette-grid" id="palette-picker">
        <!-- Injected via JS -->
      </div>

      <div class="panel-section-title" style="margin-top: 8px;">Modular Accessories</div>
      <div class="accessories-list">
        <label class="accessory-item">
          <span>🕶️ Cyber Visor / Shades</span>
          <input type="checkbox" id="acc-visor" checked />
        </label>
        <label class="accessory-item">
          <span>⛓️ Cuban Link Chain</span>
          <input type="checkbox" id="acc-chain" checked />
        </label>
        <label class="accessory-item">
          <span>🎧 Studio Headphones</span>
          <input type="checkbox" id="acc-headphones" checked />
        </label>
      </div>
    </div>

    <!-- Bottom Action Bar -->
    <footer class="hud-bottombar">
      <div class="hud-emotes">
        <button class="emote-btn" id="btn-customizer" title="Customize Avatar Palette & Gear">
          <span>⚙️</span>
          <span>AVATAR</span>
          <kbd>C</kbd>
        </button>
        <button class="emote-btn active" data-emote="0" id="emote-idle">
          <span>🕺</span>
          <span>IDLE</span>
          <kbd>1</kbd>
        </button>
        <button class="emote-btn" data-emote="2" id="emote-bounce">
          <span>🔥</span>
          <span>BOUNCE</span>
          <kbd>2</kbd>
        </button>
        <button class="emote-btn" data-emote="3" id="emote-trap">
          <span>🙌</span>
          <span>TRAP ARMS</span>
          <kbd>3</kbd>
        </button>
        <button class="emote-btn" data-emote="5" id="emote-headnod">
          <span>🎧</span>
          <span>HEAD NOD</span>
          <kbd>4</kbd>
        </button>
      </div>

      <div class="hud-badge" style="pointer-events: auto;">
        <span style="color: var(--text-dim);">CLICK CANVAS TO LOCK CAMERA // [W,A,S,D] MOVE // [SHIFT] SPRINT // [SPACE] JUMP</span>
      </div>
    </footer>
  </div>

  <div id="toast-msg">CLICK SCREEN TO ENGAGE ORBIT // SOUND & CONCERT ACTIVE</div>

  <!-- Primary Architecture Script (ES6 Modular Imports via CDN) -->
  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.168.0';
    import { CSS3DRenderer, CSS3DObject } from 'https://esm.sh/three@0.168.0/examples/jsm/renderers/CSS3DRenderer.js';
    import { joinRoom } from 'https://esm.sh/trystero@0.20.0/torrent';

    /* =========================================================================
       1. CONSTANTS & SYSTEM CONFIGURATION
       ========================================================================= */
    const CONFIG = {
      appId: 'nopex-hiphop-fest-2026',
      roomId: window.location.hash.replace('#', '') || 'main-stage',
      defaultVideoId: 'rJlNyfxACM4', // Drake - IT'S ALL A BLUR FULL SHOW LIVE (Verified 100% Available)
      bpm: 135,
      beatInterval: 60 / 135, // ~0.444s per beat
      stageWidth: 38,
      stageHeight: 21.375, // 16:9 ratio
      stageZ: -48,
      groundSize: 300,
      maxPeers: 100,
      broadcastHz: 15,
      broadcastInterval: 1000 / 15,
      gravity: -28.0,
      jumpVelocity: 11.5,
      walkSpeed: 7.5,
      sprintSpeed: 14.0
    };

    // Color Palettes
    const PALETTES = [
      { name: 'Matte Void', hex: 0x141416, css: '#141416' },
      { name: 'Cyber Pink', hex: 0xff0055, css: '#ff0055' },
      { name: 'Acid Lime', hex: 0x22e033, css: '#22e033' },
      { name: 'Electric Violet', hex: 0x8800ff, css: '#8800ff' },
      { name: 'Washed Beige', hex: 0xc8b896, css: '#c8b896' },
      { name: 'Chrome Silver', hex: 0xd4d8e0, css: '#d4d8e0' },
      { name: 'Blaze Orange', hex: 0xff4800, css: '#ff4800' },
      { name: 'Ghost Pearl', hex: 0xeeeeff, css: '#eeeeff' }
    ];

    /* =========================================================================
       2. DUAL-ENGINE SETUP (WebGLRenderer + CSS3DRenderer)
       ========================================================================= */
    const container = document.getElementById('viewport-container');
    const glCanvas = document.getElementById('webgl-canvas');
    const cssContainer = document.getElementById('css3d-container');

    // WebGL Scene, Atmosphere & Sky
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121926);
    scene.fog = new THREE.FogExp2(0x121926, 0.0038);

    // CSS3D Scene
    const sceneCSS = new THREE.Scene();

    // Shared Camera
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 18);

    // WebGL Renderer
    const webglRenderer = new THREE.WebGLRenderer({
      canvas: glCanvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    webglRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    webglRenderer.setSize(window.innerWidth, window.innerHeight);
    webglRenderer.shadowMap.enabled = true;
    webglRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
    webglRenderer.toneMapping = THREE.ACESFilmicToneMapping;
    webglRenderer.toneMappingExposure = 1.15;

    // CSS3D Renderer
    const css3dRenderer = new CSS3DRenderer();
    css3dRenderer.setSize(window.innerWidth, window.innerHeight);
    css3dRenderer.domElement.style.position = 'absolute';
    css3dRenderer.domElement.style.top = '0';
    css3dRenderer.domElement.style.left = '0';
    css3dRenderer.domElement.style.pointerEvents = 'none';
    cssContainer.appendChild(css3dRenderer.domElement);

    // Resize Handler
    function handleResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      webglRenderer.setSize(w, h);
      css3dRenderer.setSize(w, h);
    }
    window.addEventListener('resize', handleResize);

    /* =========================================================================
       3. YOUTUBE CONCERT STAGE & CSS3D EMBED
       ========================================================================= */
    // 24/7 Global Live Broadcast Schedule (Synchronized worldwide across all peers by UTC epoch)
    // 100% Verified, embeddable, full concert trap / rap performances
    const BROADCAST_SCHEDULE = [
      { artist: 'DRAKE', title: 'DRAKE // IT\'S ALL A BLUR TOUR MSG [FULL SHOW]', id: 'rJlNyfxACM4', duration: 4200 },
      { artist: 'LIL BABY', title: 'LIL BABY // ROLLING LOUD [FULL SET]', id: 'CPcpiBSuGUY', duration: 3300 },
      { artist: 'FUTURE', title: 'FUTURE // LIVE FULL CONCERT', id: 'Qp25s4rqhi4', duration: 3600 },
      { artist: 'DRAKE', title: 'DRAKE // WIRELESS FESTIVAL FULL SET', id: 'Hp40WN4Ne7A', duration: 3900 },
      { artist: 'FUTURE', title: 'FUTURE // ROLLING LOUD STADIUM SET', id: 'Ni-nKNR6lSY', duration: 3500 }
    ];

    const TOTAL_CYCLE_SEC = BROADCAST_SCHEDULE.reduce((acc, c) => acc + c.duration, 0);
    let fallbackIndex = 0;
    let ytPlayer = null;
    let isYtReady = false;
    let stageIframeObj = null;
    let isAudioUnmuted = false;

    function get247BroadcastNow() {
      const nowSec = Math.floor(Date.now() / 1000);
      let offset = nowSec % TOTAL_CYCLE_SEC;
      for (let i = 0; i < BROADCAST_SCHEDULE.length; i++) {
        const item = BROADCAST_SCHEDULE[i];
        if (offset < item.duration) {
          return { item, seekTime: offset, index: i };
        }
        offset -= item.duration;
      }
      return { item: BROADCAST_SCHEDULE[0], seekTime: 0, index: 0 };
    }

    const initialBroadcast = get247BroadcastNow();
    let currentVideoId = initialBroadcast.item.id;

    function loadBroadcastItem(item, seekTime = 0) {
      const label = document.getElementById('live-broadcast-label');
      if (label) label.textContent = item.title;

      if (currentVideoId !== item.id) {
        currentVideoId = item.id;
        const iframe = document.getElementById('stage-youtube-iframe');
        if (iframe) {
          const seekParam = seekTime > 5 ? `&start=${Math.floor(seekTime)}` : '';
          iframe.src = `https://www.youtube.com/embed/${item.id}?enablejsapi=1&autoplay=1&mute=${isAudioUnmuted ? 0 : 1}&controls=0&disablekb=1&fs=0&modestbranding=1&iv_load_policy=3&loop=1&playlist=${item.id}&playsinline=1&rel=0${seekParam}`;
        }
      }

      if (isYtReady && ytPlayer && ytPlayer.seekTo) {
        const myTime = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
        if (seekTime > 0 && Math.abs(myTime - seekTime) > 4.0) {
          ytPlayer.seekTo(seekTime, true);
        }
        ytPlayer.playVideo();
      }
    }

    function sync247Stream() {
      const { item, seekTime } = get247BroadcastNow();
      loadBroadcastItem(item, seekTime);
    }

    // Failover Guard: If any video triggers an error, auto-advance to next verified concert
    function skipToNextBroadcast() {
      fallbackIndex = (fallbackIndex + 1) % BROADCAST_SCHEDULE.length;
      const nextItem = BROADCAST_SCHEDULE[fallbackIndex];
      console.log(`[STAGE AUTO-FAILOVER] Switching to: ${nextItem.title} (${nextItem.id})`);
      loadBroadcastItem(nextItem, 0);
    }

    function cycleNextHeadliner() {
      skipToNextBroadcast();
    }

    function buildConcertScreen() {
      const broadcastNow = get247BroadcastNow();
      currentVideoId = broadcastNow.item.id;
      const initialSeek = broadcastNow.seekTime;
      const label = document.getElementById('live-broadcast-label');
      if (label) label.textContent = broadcastNow.item.title;

      // 1. Create CSS3D Iframe with continuous autoplay and playlist looping
      const iframe = document.createElement('iframe');
      iframe.className = 'css3d-interactive';
      iframe.id = 'stage-youtube-iframe';
      iframe.style.width = '1280px';
      iframe.style.height = '720px';
      iframe.style.border = '0';
      iframe.style.backgroundColor = '#000';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      const seekParam = initialSeek > 5 ? `&start=${Math.floor(initialSeek)}` : '';
      iframe.src = `https://www.youtube.com/embed/${currentVideoId}?enablejsapi=1&autoplay=1&mute=1&controls=0&disablekb=1&fs=0&modestbranding=1&iv_load_policy=3&loop=1&playlist=${currentVideoId}&playsinline=1&rel=0${seekParam}`;

      // CSS3D Scale Factor: Screen Dimensions / 1280
      const scaleFactor = CONFIG.stageWidth / 1280;
      stageIframeObj = new CSS3DObject(iframe);
      stageIframeObj.position.set(0, 15, CONFIG.stageZ);
      stageIframeObj.scale.set(scaleFactor, scaleFactor, 1);
      sceneCSS.add(stageIframeObj);

      // Initialize YouTube API Client
      function initStagePlayer() {
        if (ytPlayer || !window.YT || !window.YT.Player) return;
        try {
          ytPlayer = new window.YT.Player('stage-youtube-iframe', {
            events: {
              onReady: (event) => {
                isYtReady = true;
                console.log('[STAGE] 24/7 YouTube Stream Initialized');
                try {
                  event.target.playVideo();
                } catch(err) {}
              },
              onStateChange: (event) => {
                if (window.YT) {
                  if (event.data === window.YT.PlayerState.ENDED) {
                    cycleNextHeadliner();
                  } else if (event.data === window.YT.PlayerState.PAUSED) {
                    event.target.playVideo();
                  }
                }
              },
              onError: (event) => {
                console.warn('[STAGE WATCHDOG] Video unavailable or embed blocked (Code ' + event.data + '). Auto-skipping!');
                skipToNextBroadcast();
              }
            }
          });
        } catch(e) {
          console.warn('[STAGE] Player creation deferred:', e);
        }
      }

      window.onYouTubeIframeAPIReady = initStagePlayer;
      if (window.YT && window.YT.Player) {
        initStagePlayer();
      }

      // 2. WebGL LED Screen Frame, Scaffolding, Speaker Stacks & DJ Deck
      buildStageScaffolding();
    }

    // Procedural Lush Festival Lawn / Green Grass (Gramado) Texture via Canvas
    function createGrassTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 512;
      cvs.height = 512;
      const ctx = cvs.getContext('2d');

      // Base vibrant festival green turf
      ctx.fillStyle = '#26541f';
      ctx.fillRect(0, 0, 512, 512);

      // Alternating lawn stripe mower patterns (stadium / festival arena look)
      for (let y = 0; y < 512; y += 64) {
        ctx.fillStyle = (y / 64) % 2 === 0 ? 'rgba(44, 98, 36, 0.42)' : 'rgba(30, 72, 24, 0.42)';
        ctx.fillRect(0, y, 512, 64);
      }

      // Fine grass blades and color micro-variation
      for (let i = 0; i < 55000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = Math.floor(Math.random() * 30) + 30;
        const g = Math.floor(Math.random() * 80) + 110;
        const b = Math.floor(Math.random() * 30) + 20;
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(x, y, 2, 2.5);
      }

      // Natural soft organic soil & grass patches
      for (let i = 0; i < 24; i++) {
        const cx = Math.random() * 512;
        const cy = Math.random() * 512;
        const rad = Math.random() * 60 + 25;
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
        grad.addColorStop(0, 'rgba(65, 140, 48, 0.35)');
        grad.addColorStop(1, 'rgba(30, 70, 22, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.fill();
      }

      const texture = new THREE.CanvasTexture(cvs);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(50, 50);
      return texture;
    }

    // Moving Head Concert Spotlights with Volumetric Cones
    const spotlights = [];
    const SPOTLIGHT_COLORS = [0x00f0ff, 0xff0055, 0x39ff14, 0xffb700, 0x9d00ff, 0x00ffff];

    function buildSpotlightRig() {
      const spotGroup = new THREE.Group();
      const xPositions = [-15, -9, -3, 3, 9, 15];

      xPositions.forEach((posX, idx) => {
        const color = SPOTLIGHT_COLORS[idx % SPOTLIGHT_COLORS.length];

        // Three.js SpotLight
        const spot = new THREE.SpotLight(color, 2.5, 90, Math.PI / 7, 0.4, 1.2);
        spot.position.set(posX, 28, CONFIG.stageZ + 4);

        // Moving Target Dummy
        const targetObj = new THREE.Object3D();
        targetObj.position.set(posX * 1.5, 0, 10);
        scene.add(targetObj);
        spot.target = targetObj;

        // Volumetric Cone Geometry (Additive Blending)
        const coneGeo = new THREE.CylinderGeometry(0.2, 4.8, 36, 16, 1, true);
        coneGeo.translate(0, -18, 0); // anchor at top
        coneGeo.rotateX(-Math.PI / 2); // align with z-forward

        const coneMat = new THREE.MeshBasicMaterial({
          color: color,
          transparent: true,
          opacity: 0.18,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        const coneMesh = new THREE.Mesh(coneGeo, coneMat);
        spot.add(coneMesh);

        scene.add(spot);

        spotlights.push({
          light: spot,
          target: targetObj,
          cone: coneMesh,
          baseX: posX,
          colorHex: color,
          phase: idx * 1.1,
          speedA: 0.9 + (idx % 3) * 0.35,
          speedB: 1.1 + ((idx + 1) % 3) * 0.28
        });
      });

      // Stage Front Blinding Strobe Light
      window.strobeLight = new THREE.PointLight(0xffffff, 0, 120);
      window.strobeLight.position.set(0, 16, CONFIG.stageZ + 18);
      scene.add(window.strobeLight);
    }

    /* =========================================================================
       5. ANONYMOUS PROCEDURAL AVATAR RIG & ANIMATION ENGINE
       ========================================================================= */
    const AVATAR_GEO = {
      torso: new THREE.BoxGeometry(0.85, 1.1, 0.5),
      head: new THREE.DodecahedronGeometry(0.38),
      upperArm: new THREE.BoxGeometry(0.24, 0.55, 0.24),
      lowerArm: new THREE.BoxGeometry(0.22, 0.55, 0.22),
      hand: new THREE.BoxGeometry(0.18, 0.22, 0.18),
      thigh: new THREE.BoxGeometry(0.3, 0.65, 0.3),
      calf: new THREE.BoxGeometry(0.26, 0.65, 0.26),
      foot: new THREE.BoxGeometry(0.28, 0.16, 0.5),
      visor: new THREE.BoxGeometry(0.62, 0.16, 0.32),
      chain: new THREE.TorusGeometry(0.28, 0.05, 8, 20),
      headphonesBand: new THREE.TorusGeometry(0.42, 0.04, 8, 16, Math.PI),
      earcup: new THREE.CylinderGeometry(0.12, 0.12, 0.1, 12)
    };

    function createAvatarRig(colorHex, accessoryBitmask = 7) {
      const root = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({
        color: colorHex,
        roughness: 0.6,
        metalness: 0.2
      });
      const skinMat = new THREE.MeshStandardMaterial({
        color: 0x1f1f26,
        roughness: 0.8,
        metalness: 0.1
      });
      const metallicMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        metalness: 0.95,
        roughness: 0.2
      });
      const visorMat = new THREE.MeshBasicMaterial({
        color: 0x00f0ff,
        transparent: true,
        opacity: 0.9
      });

      // Pelvis / Root Pivot
      const pelvis = new THREE.Group();
      pelvis.position.y = 1.6;
      root.add(pelvis);

      // Torso
      const torso = new THREE.Mesh(AVATAR_GEO.torso, bodyMat);
      torso.position.y = 0.55;
      pelvis.add(torso);

      // Head & Neck
      const neck = new THREE.Group();
      neck.position.y = 0.6;
      torso.add(neck);

      const head = new THREE.Mesh(AVATAR_GEO.head, skinMat);
      head.position.y = 0.38;
      neck.add(head);

      // Accessories
      const accessories = new THREE.Group();
      head.add(accessories);

      // 0b001 (1): Cyber Visor
      const visor = new THREE.Mesh(AVATAR_GEO.visor, visorMat);
      visor.position.set(0, 0.05, 0.3);
      visor.visible = (accessoryBitmask & 1) !== 0;
      accessories.add(visor);

      // 0b010 (2): Cuban Chain
      const chain = new THREE.Mesh(AVATAR_GEO.chain, metallicMat);
      chain.rotation.x = Math.PI / 2.5;
      chain.position.set(0, -0.32, 0.08);
      chain.visible = (accessoryBitmask & 2) !== 0;
      torso.add(chain);

      // 0b100 (4): Headphones
      const hpGroup = new THREE.Group();
      const hpBand = new THREE.Mesh(AVATAR_GEO.headphonesBand, bodyMat);
      hpBand.rotation.z = Math.PI;
      hpBand.position.y = 0.1;
      const leftCup = new THREE.Mesh(AVATAR_GEO.earcup, skinMat);
      leftCup.rotation.z = Math.PI / 2;
      leftCup.position.set(-0.4, 0.0, 0);
      const rightCup = leftCup.clone();
      rightCup.position.x = 0.4;
      hpGroup.add(hpBand, leftCup, rightCup);
      hpGroup.visible = (accessoryBitmask & 4) !== 0;
      head.add(hpGroup);

      // Limbs Builder Helper
      function buildLimb(isLeft, isLeg) {
        const hipShoulder = new THREE.Group();
        if (isLeg) {
          hipShoulder.position.set(isLeft ? -0.28 : 0.28, 0, 0);
          pelvis.add(hipShoulder);

          const upper = new THREE.Mesh(AVATAR_GEO.thigh, bodyMat);
          upper.position.y = -0.32;
          hipShoulder.add(upper);

          const knee = new THREE.Group();
          knee.position.y = -0.32;
          upper.add(knee);

          const lower = new THREE.Mesh(AVATAR_GEO.calf, skinMat);
          lower.position.y = -0.32;
          knee.add(lower);

          const foot = new THREE.Mesh(AVATAR_GEO.foot, bodyMat);
          foot.position.set(0, -0.32, 0.1);
          lower.add(foot);

          return { jointA: hipShoulder, jointB: knee };
        } else {
          hipShoulder.position.set(isLeft ? -0.58 : 0.58, 0.45, 0);
          torso.add(hipShoulder);

          const upper = new THREE.Mesh(AVATAR_GEO.upperArm, bodyMat);
          upper.position.y = -0.28;
          hipShoulder.add(upper);

          const elbow = new THREE.Group();
          elbow.position.y = -0.28;
          upper.add(elbow);

          const lower = new THREE.Mesh(AVATAR_GEO.lowerArm, skinMat);
          lower.position.y = -0.28;
          elbow.add(lower);

          const hand = new THREE.Mesh(AVATAR_GEO.hand, skinMat);
          hand.position.y = -0.28;
          lower.add(hand);

          return { jointA: hipShoulder, jointB: elbow };
        }
      }

      const leftLeg = buildLimb(true, true);
      const rightLeg = buildLimb(false, true);
      const leftArm = buildLimb(true, false);
      const rightArm = buildLimb(false, false);

      return {
        root,
        pelvis,
        torso,
        neck,
        head,
        visor,
        chain,
        hpGroup,
        bodyMat,
        leftLeg,
        rightLeg,
        leftArm,
        rightArm
      };
    }

    // Procedural Animation State Machine
    function updateAvatarKinematics(rig, animState, speed, elapsed, delta) {
      const beatProgress = (elapsed % CONFIG.beatInterval) / CONFIG.beatInterval;
      const beatSin = Math.sin(beatProgress * Math.PI * 2);
      const walkCycle = elapsed * 10.0;

      let tPelvisY = 1.6;
      let tTorsoX = 0, tTorsoY = 0;
      let tHeadX = 0, tHeadY = 0;
      let tLArmX = 0, tLArmZ = 0, tLElbowX = 0;
      let tRArmX = 0, tRArmZ = 0, tRElbowX = 0;
      let tLLegX = 0, tLKneeX = 0;
      let tRLegX = 0, tRKneeX = 0;

      switch (animState) {
        case 1: // Walk / Run
          const stride = Math.min(speed / CONFIG.sprintSpeed, 1.2);
          tPelvisY = 1.6 + Math.abs(Math.sin(walkCycle * 2)) * 0.12 * stride;
          tTorsoX = 0.12 * stride;
          tTorsoY = Math.sin(walkCycle) * 0.15 * stride;

          tLLegX = Math.sin(walkCycle) * 0.75 * stride;
          tRLegX = -Math.sin(walkCycle) * 0.75 * stride;
          tLKneeX = Math.max(0, -Math.sin(walkCycle) * 0.8 * stride);
          tRKneeX = Math.max(0, Math.sin(walkCycle) * 0.8 * stride);

          tLArmX = -Math.sin(walkCycle) * 0.65 * stride;
          tRArmX = Math.sin(walkCycle) * 0.65 * stride;
          tLElbowX = -0.35 * stride;
          tRElbowX = -0.35 * stride;
          break;

        case 2: // Hip-Hop Bounce (135 BPM bounce)
          const bounce = Math.abs(beatSin);
          tPelvisY = 1.6 - bounce * 0.32;
          tTorsoX = 0.22 + bounce * 0.15;
          tHeadX = -beatSin * 0.35;

          tLKneeX = bounce * 0.65;
          tRKneeX = bounce * 0.65;
          tLLegX = -bounce * 0.3;
          tRLegX = -bounce * 0.3;

          tLArmX = -0.6 - bounce * 0.4;
          tRArmX = -0.6 - bounce * 0.4;
          tLArmZ = 0.35;
          tRArmZ = -0.35;
          tLElbowX = -0.9 - bounce * 0.3;
          tRElbowX = -0.9 - bounce * 0.3;
          break;

        case 3: // Trap Arms / Crowd Hype
          const hypeBeat = (elapsed * 3.5) % (Math.PI * 2);
          tPelvisY = 1.6 + Math.abs(Math.sin(hypeBeat * 2)) * 0.18;
          tHeadX = Math.sin(hypeBeat * 2) * 0.25;

          tLArmX = -2.4 + Math.sin(hypeBeat) * 0.5;
          tRArmX = -2.4 - Math.sin(hypeBeat) * 0.5;
          tLArmZ = 0.45;
          tRArmZ = -0.45;
          tLElbowX = -0.6 + Math.cos(hypeBeat) * 0.3;
          tRElbowX = -0.6 - Math.cos(hypeBeat) * 0.3;
          break;

        case 4: // Jump / Float in Air
          tPelvisY = 1.6;
          tTorsoX = -0.15;
          tLLegX = 0.5;
          tRLegX = 0.2;
          tLKneeX = 0.9;
          tRKneeX = 0.6;
          tLArmX = -1.8;
          tRArmX = -1.8;
          tLArmZ = 0.8;
          tRArmZ = -0.8;
          break;

        case 5: // Sharp Head Nod
          tHeadX = -Math.abs(beatSin) * 0.65;
          tTorsoX = Math.abs(beatSin) * 0.15;
          tPelvisY = 1.6 - Math.abs(beatSin) * 0.08;
          tLArmX = -0.2;
          tRArmX = -0.2;
          break;

        case 0: // Idle
        default:
          const idleBreath = Math.sin(elapsed * 2.2);
          tPelvisY = 1.6 + idleBreath * 0.03;
          tTorsoX = idleBreath * 0.02;
          tHeadX = Math.sin(elapsed * 4.4) * 0.08;
          tLArmZ = 0.12;
          tRArmZ = -0.12;
          break;
      }

      const lerpSpeed = delta * 15.0;
      rig.pelvis.position.y += (tPelvisY - rig.pelvis.position.y) * lerpSpeed;
      rig.torso.rotation.x += (tTorsoX - rig.torso.rotation.x) * lerpSpeed;
      rig.torso.rotation.y += (tTorsoY - rig.torso.rotation.y) * lerpSpeed;
      rig.head.rotation.x += (tHeadX - rig.head.rotation.x) * lerpSpeed;

      rig.leftLeg.jointA.rotation.x += (tLLegX - rig.leftLeg.jointA.rotation.x) * lerpSpeed;
      rig.leftLeg.jointB.rotation.x += (tLKneeX - rig.leftLeg.jointB.rotation.x) * lerpSpeed;
      rig.rightLeg.jointA.rotation.x += (tRLegX - rig.rightLeg.jointA.rotation.x) * lerpSpeed;
      rig.rightLeg.jointB.rotation.x += (tRKneeX - rig.rightLeg.jointB.rotation.x) * lerpSpeed;

      rig.leftArm.jointA.rotation.x += (tLArmX - rig.leftArm.jointA.rotation.x) * lerpSpeed;
      rig.leftArm.jointA.rotation.z += (tLArmZ - rig.leftArm.jointA.rotation.z) * lerpSpeed;
      rig.leftArm.jointB.rotation.x += (tLElbowX - rig.leftArm.jointB.rotation.x) * lerpSpeed;

      rig.rightArm.jointA.rotation.x += (tRArmX - rig.rightArm.jointA.rotation.x) * lerpSpeed;
      rig.rightArm.jointA.rotation.z += (tRArmZ - rig.rightArm.jointA.rotation.z) * lerpSpeed;
      rig.rightArm.jointB.rotation.x += (tRElbowX - rig.rightArm.jointB.rotation.x) * lerpSpeed;
    }

    /* =========================================================================
       6. LOCAL PLAYER CONTROLLER & THIRD-PERSON CAMERA
       ========================================================================= */
    const player = {
      position: new THREE.Vector3(0, 0, 10),
      velocity: new THREE.Vector3(),
      rotationY: 0,
      animState: 0,
      colorIdx: 1,
      accessories: 7,
      isGrounded: true,
      rig: null
    };

    player.rig = createAvatarRig(PALETTES[player.colorIdx].hex, player.accessories);
    scene.add(player.rig.root);

    const cameraRig = {
      yaw: 0,
      pitch: 0.25,
      distance: 6.8,
      targetDistance: 6.8,
      isLocked: false
    };

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;

      if (e.code === 'Digit1') setEmote(0);
      if (e.code === 'Digit2') setEmote(2);
      if (e.code === 'Digit3') setEmote(3);
      if (e.code === 'Digit4') setEmote(5);
      if (e.code === 'KeyC') toggleCustomizer();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    const crosshair = document.getElementById('crosshair');

    glCanvas.addEventListener('click', () => {
      if (!cameraRig.isLocked) {
        glCanvas.requestPointerLock();
      }
    });

    document.addEventListener('pointerlockchange', () => {
      cameraRig.isLocked = document.pointerLockElement === glCanvas;
      crosshair.classList.toggle('locked', cameraRig.isLocked);
    });

    document.addEventListener('mousemove', (e) => {
      if (cameraRig.isLocked) {
        cameraRig.yaw -= e.movementX * 0.0025;
        cameraRig.pitch -= e.movementY * 0.0025;
        cameraRig.pitch = Math.max(-0.25, Math.min(1.2, cameraRig.pitch));
      }
    });

    window.addEventListener('wheel', (e) => {
      cameraRig.targetDistance += e.deltaY * 0.005;
      cameraRig.targetDistance = Math.max(3.2, Math.min(14.0, cameraRig.targetDistance));
    }, { passive: true });

    function setEmote(stateId) {
      player.animState = stateId;
      document.querySelectorAll('.emote-btn[data-emote]').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.emote) === stateId);
      });
    }

    /* =========================================================================
       7. ZERO-COST P2P NETWORKING (Trystero BitTorrent Tracker)
       ========================================================================= */
    const remotePeers = new Map();
    let p2pRoom = null;
    let sendTransformAction = null;
    let sendSyncAction = null;

    function initNetworking() {
      try {
        p2pRoom = joinRoom({ appId: CONFIG.appId }, CONFIG.roomId);

        const [sendTransform, getTransform] = p2pRoom.makeAction('tx');
        const [sendSync, getSync] = p2pRoom.makeAction('sync');
        sendTransformAction = sendTransform;
        sendSyncAction = sendSync;

        p2pRoom.onPeerJoin((peerId) => {
          updateCrowdCounter();
          if (isYtReady && ytPlayer && ytPlayer.getCurrentTime) {
            sendSync({
              vid: currentVideoId,
              time: ytPlayer.getCurrentTime(),
              epoch: Date.now()
            }, peerId);
          }
        });

        p2pRoom.onPeerLeave((peerId) => {
          removeRemotePeer(peerId);
          updateCrowdCounter();
        });

        getTransform((packet, peerId) => {
          if (!Array.isArray(packet) || packet.length < 7) return;

          const [x, y, z, rotY, animState, colorIdx, accessories] = packet;
          let peer = remotePeers.get(peerId);

          if (!peer) {
            const rig = createAvatarRig(PALETTES[colorIdx % PALETTES.length].hex, accessories);
            scene.add(rig.root);
            peer = {
              rig,
              targetPos: new THREE.Vector3(x, y, z),
              targetRot: rotY,
              animState: animState,
              colorIdx: colorIdx,
              accessories: accessories,
              speed: 0,
              lastSeen: performance.now()
            };
            remotePeers.set(peerId, peer);
            updateCrowdCounter();
          } else {
            peer.targetPos.set(x, y, z);
            peer.targetRot = rotY;
            peer.animState = animState;
            peer.lastSeen = performance.now();

            if (peer.colorIdx !== colorIdx) {
              peer.colorIdx = colorIdx;
              peer.rig.bodyMat.color.setHex(PALETTES[colorIdx % PALETTES.length].hex);
            }
            if (peer.accessories !== accessories) {
              peer.accessories = accessories;
              peer.rig.visor.visible = (accessories & 1) !== 0;
              peer.rig.chain.visible = (accessories & 2) !== 0;
              peer.rig.hpGroup.visible = (accessories & 4) !== 0;
            }
          }
        });

        getSync((data) => {
          if (data.vid && data.vid !== currentVideoId) {
            switchVideo(data.vid, false);
          }
          if (isYtReady && ytPlayer && ytPlayer.seekTo && data.time !== undefined) {
            const elapsedSinceHost = (Date.now() - data.epoch) / 1000;
            const targetTime = data.time + elapsedSinceHost;
            const myTime = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : targetTime;
            if (Math.abs(myTime - targetTime) > 1.8) {
              ytPlayer.seekTo(targetTime, true);
            }
          }
        });

        setInterval(broadcastPlayerTransform, CONFIG.broadcastInterval);

        setInterval(() => {
          if (isYtReady && ytPlayer && ytPlayer.getCurrentTime && sendSyncAction) {
            sendSyncAction({
              vid: currentVideoId,
              time: ytPlayer.getCurrentTime(),
              epoch: Date.now()
            });
          }
        }, 4000);

      } catch (err) {
        console.warn('[P2P] Offline / Standalone mode active:', err);
      }
    }

    function broadcastPlayerTransform() {
      if (!sendTransformAction) return;

      const packet = [
        Math.round(player.position.x * 100) / 100,
        Math.round(player.position.y * 100) / 100,
        Math.round(player.position.z * 100) / 100,
        Math.round(player.rotationY * 100) / 100,
        player.animState,
        player.colorIdx,
        player.accessories
      ];
      sendTransformAction(packet);
    }

    function removeRemotePeer(peerId) {
      const peer = remotePeers.get(peerId);
      if (peer) {
        scene.remove(peer.rig.root);
        remotePeers.delete(peerId);
      }
    }

    function cleanupStalePeers() {
      const now = performance.now();
      for (const [peerId, peer] of remotePeers.entries()) {
        if (now - peer.lastSeen > 5000) {
          removeRemotePeer(peerId);
          updateCrowdCounter();
        }
      }
    }

    function updateCrowdCounter() {
      const totalCount = remotePeers.size + 1;
      document.getElementById('crowd-count').textContent = `CROWD: ${totalCount} / ${CONFIG.maxPeers}`;
    }

    /* =========================================================================
       8. UI CONTROLS & CUSTOMIZATION SYSTEM
       ========================================================================= */
    const customizerPanel = document.getElementById('customizer-panel');
    const visorOverlay = document.getElementById('visor-overlay');

    const paletteContainer = document.getElementById('palette-picker');
    PALETTES.forEach((p, idx) => {
      const chip = document.createElement('div');
      chip.className = `color-chip ${idx === player.colorIdx ? 'selected' : ''}`;
      chip.style.backgroundColor = p.css;
      chip.title = p.name;
      chip.addEventListener('click', () => {
        player.colorIdx = idx;
        player.rig.bodyMat.color.setHex(p.hex);
        document.querySelectorAll('.color-chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        broadcastPlayerTransform();
      });
      paletteContainer.appendChild(chip);
    });

    const visorCheck = document.getElementById('acc-visor');
    const chainCheck = document.getElementById('acc-chain');
    const hpCheck = document.getElementById('acc-headphones');

    function updateAccessoriesFromUI() {
      let mask = 0;
      if (visorCheck.checked) mask |= 1;
      if (chainCheck.checked) mask |= 2;
      if (hpCheck.checked) mask |= 4;

      player.accessories = mask;
      player.rig.visor.visible = visorCheck.checked;
      player.rig.chain.visible = chainCheck.checked;
      player.rig.hpGroup.visible = hpCheck.checked;

      visorOverlay.classList.toggle('active', visorCheck.checked);
      broadcastPlayerTransform();
    }

    visorCheck.addEventListener('change', updateAccessoriesFromUI);
    chainCheck.addEventListener('change', updateAccessoriesFromUI);
    hpCheck.addEventListener('change', updateAccessoriesFromUI);
    updateAccessoriesFromUI();

    function toggleCustomizer() {
      customizerPanel.classList.toggle('visible');
    }
    document.getElementById('btn-customizer').addEventListener('click', toggleCustomizer);
    document.getElementById('close-customizer').addEventListener('click', () => customizerPanel.classList.remove('visible'));

    // Audio State & Continuous Playback System
    const btnSound = document.getElementById('btn-sound-toggle');

    function updateSoundUI() {
      if (!btnSound) return;
      const icon = document.getElementById('sound-icon');
      const text = document.getElementById('sound-text');
      if (isAudioUnmuted) {
        icon.textContent = '🔊';
        text.textContent = 'SOUND ON';
        btnSound.style.borderColor = 'var(--neon-lime)';
        btnSound.style.color = 'var(--neon-lime)';
      } else {
        icon.textContent = '🔇';
        text.textContent = 'CLICK TO UNMUTE';
        btnSound.style.borderColor = 'var(--neon-pink)';
        btnSound.style.color = 'var(--neon-pink)';
      }
    }

    function ensurePlaybackAndAudio() {
      if (isYtReady && ytPlayer) {
        try {
          ytPlayer.playVideo();
          if (!isAudioUnmuted) {
            ytPlayer.unMute();
            ytPlayer.setVolume(100);
            isAudioUnmuted = true;
            updateSoundUI();
            showToast('STAGE AUDIO UNMUTED // 24/7 BROADCAST ON AIR');
          }
        } catch(e) {}
      }
    }

    // Auto-unmute on first player movement or click anywhere
    window.addEventListener('click', ensurePlaybackAndAudio);
    window.addEventListener('keydown', ensurePlaybackAndAudio);
    window.addEventListener('pointerdown', ensurePlaybackAndAudio);

    btnSound.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isYtReady && ytPlayer) {
        if (isAudioUnmuted) {
          ytPlayer.mute();
          isAudioUnmuted = false;
        } else {
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
          ytPlayer.playVideo();
          isAudioUnmuted = true;
        }
        updateSoundUI();
      }
    });

    // Continuous Playback Watchdog: Guarantees 24/7 stream NEVER pauses (checks every 1.2 seconds)
    setInterval(() => {
      if (isYtReady && ytPlayer && ytPlayer.getPlayerState) {
        const state = ytPlayer.getPlayerState();
        // State 1 = PLAYING, 3 = BUFFERING. If state is 2 (PAUSED), -1 (UNSTARTED), 0 (ENDED), 5 (CUED): FORCE PLAY!
        if (state !== 1 && state !== 3) {
          ytPlayer.playVideo();
        }
      }
    }, 1200);

    // Periodic 24/7 Global Time-Sync Check (every 8s)
    setInterval(sync247Stream, 8000);

    document.querySelectorAll('.emote-btn[data-emote]').forEach(btn => {
      btn.addEventListener('click', () => {
        setEmote(parseInt(btn.dataset.emote));
      });
    });

    const btnSync = document.getElementById('btn-sync');
    if (btnSync) {
      btnSync.addEventListener('click', () => {
        ensurePlaybackAndAudio();
        showToast('STAGE AUDIO & SYNC TRIGGERED');
      });
    }

    // Continuous Playback Watchdog: Guarantees video is ALWAYS playing
    setInterval(() => {
      if (isYtReady && ytPlayer && ytPlayer.getPlayerState) {
        const state = ytPlayer.getPlayerState();
        // 2: paused, -1: unstarted, 0: ended, 5: video cued
        if (state === 2 || state === -1 || state === 0 || state === 5) {
          ytPlayer.playVideo();
        }
      }
    }, 2500);

    function showToast(msg) {
      const toast = document.getElementById('toast-msg');
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 3000);
    }

    /* =========================================================================
       9. MASTER RENDER & SIMULATION LOOP
       ========================================================================= */
    const clock = new THREE.Clock();
    let lastCleanupTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      // 1. Procedural Concert Lighting & Lissajous Spotlights
      const beatProgress = (elapsed % CONFIG.beatInterval) / CONFIG.beatInterval;
      const beatPulse = Math.exp(-beatProgress * 5.5);

      spotlights.forEach((spot) => {
        const t = elapsed * 0.75 + spot.phase;
        spot.target.position.x = spot.baseX * 1.8 + Math.sin(t * spot.speedA) * 16;
        spot.target.position.z = 8 + Math.cos(t * spot.speedB) * 26;

        spot.light.intensity = 1.2 + beatPulse * 3.4;
        spot.cone.material.opacity = 0.12 + beatPulse * 0.28;
      });

      if (window.subwoofers) {
        const subScale = 1.0 + beatPulse * 0.22;
        window.subwoofers.forEach(cone => {
          cone.scale.set(subScale, subScale, subScale);
        });
      }

      const beatCount = Math.floor(elapsed / CONFIG.beatInterval);
      if (window.strobeLight) {
        if (beatCount % 8 === 0 && beatProgress < 0.18) {
          window.strobeLight.intensity = 4.0;
        } else {
          window.strobeLight.intensity = 0;
        }
      }

      // 2. Local Player Kinematics & Physics
      const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
      const moveSpeed = isSprinting ? CONFIG.sprintSpeed : CONFIG.walkSpeed;
      const moveInput = new THREE.Vector3();

      if (keys['KeyW'] || keys['ArrowUp']) moveInput.z -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) moveInput.z += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) moveInput.x -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) moveInput.x += 1;

      const hasMoveInput = moveInput.lengthSq() > 0;
      if (hasMoveInput) {
        moveInput.normalize();
        moveInput.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRig.yaw);

        player.velocity.x = moveInput.x * moveSpeed;
        player.velocity.z = moveInput.z * moveSpeed;

        const targetRot = Math.atan2(moveInput.x, moveInput.z);
        let diff = targetRot - player.rotationY;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        player.rotationY += diff * delta * 12.0;

        if (player.isGrounded && player.animState !== 1) {
          player.animState = 1;
        }
      } else {
        player.velocity.x *= 0.75;
        player.velocity.z *= 0.75;

        if (player.isGrounded && player.animState === 1) {
          player.animState = 0;
        }
      }

      // Jump Physics
      if (keys['Space'] && player.isGrounded) {
        player.velocity.y = CONFIG.jumpVelocity;
        player.isGrounded = false;
        player.animState = 4;
      }

      if (!player.isGrounded) {
        player.velocity.y += CONFIG.gravity * delta;
      }

      player.position.x += player.velocity.x * delta;
      player.position.y += player.velocity.y * delta;
      player.position.z += player.velocity.z * delta;

      // Ground Collision Clamp
      if (player.position.y <= 0) {
        player.position.y = 0;
        player.velocity.y = 0;
        if (!player.isGrounded) {
          player.isGrounded = true;
          if (!hasMoveInput) player.animState = 0;
        }
      }

      player.position.x = Math.max(-75, Math.min(75, player.position.x));
      player.position.z = Math.max(CONFIG.stageZ + 12, Math.min(65, player.position.z));

      player.rig.root.position.copy(player.position);
      player.rig.root.rotation.y = player.rotationY;

      const currentHorizontalSpeed = Math.hypot(player.velocity.x, player.velocity.z);
      updateAvatarKinematics(player.rig, player.animState, currentHorizontalSpeed, elapsed, delta);

      // 3. Smooth Damped Third-Person Camera Follow
      cameraRig.distance += (cameraRig.targetDistance - cameraRig.distance) * delta * 10.0;

      const camTargetPos = new THREE.Vector3(
        player.position.x,
        player.position.y + 1.8,
        player.position.z
      );

      const camOffsetX = Math.sin(cameraRig.yaw) * Math.cos(cameraRig.pitch) * cameraRig.distance;
      const camOffsetY = Math.sin(cameraRig.pitch) * cameraRig.distance;
      const camOffsetZ = Math.cos(cameraRig.yaw) * Math.cos(cameraRig.pitch) * cameraRig.distance;

      const idealCamPos = new THREE.Vector3(
        camTargetPos.x + camOffsetX,
        Math.max(0.6, camTargetPos.y + camOffsetY),
        camTargetPos.z + camOffsetZ
      );

      camera.position.lerp(idealCamPos, delta * 12.0);
      camera.lookAt(camTargetPos);

      // 4. Remote Peers Interpolation & Animation
      remotePeers.forEach((peer) => {
        peer.rig.root.position.lerp(peer.targetPos, delta * 14.0);

        let rotDiff = peer.targetRot - peer.rig.root.rotation.y;
        while (rotDiff < -Math.PI) rotDiff += Math.PI * 2;
        while (rotDiff > Math.PI) rotDiff -= Math.PI * 2;
        peer.rig.root.rotation.y += rotDiff * delta * 14.0;

        updateAvatarKinematics(peer.rig, peer.animState, 6.0, elapsed, delta);
      });

      if (elapsed - lastCleanupTime > 2.0) {
        cleanupStalePeers();
        lastCleanupTime = elapsed;
      }

      // 5. Synchronized Dual-Engine Render
      css3dRenderer.render(sceneCSS, camera);
      webglRenderer.render(scene, camera);
    }

    /* =========================================================================
       10. BOOTSTRAP SYSTEM
       ========================================================================= */
    try {
      buildConcertScreen();
      buildEnvironment();
      buildSpotlightRig();
      sync247Stream();
    } catch (err) {
      console.error('[CRITICAL INIT ERROR]', err);
    }

    try {
      initNetworking();
    } catch (err) {
      console.warn('[NETWORKING INIT]', err);
    }

    animate();

    console.log('[SYSTEM] Open-Air 3D Hip-Hop Festival & Live Stage Engine Online.');
  </script>
